version: 2
updates:
  # Dependências npm (package.json)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      expo-e-relacionados:
        patterns:
          - 'expo*'
          - '@expo/*'
          - '@expo-google-fonts/*'
      ferramentas-de-qualidade:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
          - 'husky'
          - 'lint-staged'
          - '@commitlint/*'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # Ações usadas nos workflows (.github/workflows)
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
      include: 'scope'
